name: Build desktop app

# PyInstaller cannot cross-compile: a .exe has to be produced *on* Windows and a
# .app on macOS. These runners are the only place that can do both, so the
# Windows build lives here rather than in packaging/build.py.
#
# Trigger it from the Actions tab (Run workflow) for a one-off Windows zip, or
# push a v* tag to attach both platforms to a release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            python: "3.12"
            archive: CodeErratum-windows-x64.zip
          - os: macos-latest
            label: macOS
            python: "3.12"
            archive: CodeErratum-macos.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        # desktop = pywebview (plus pythonnet on Windows), pack = PyInstaller.
        run: uv sync --extra desktop --extra pack

      - name: Build
        # Runs packaging/build.py, which ends by executing the frozen binary with
        # --selftest: a bundle that is missing the UI, the prompts or the webview
        # backend fails here instead of after someone downloads it.
        run: uv run python packaging/build.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto, not zip: a plain zip drops the symlinks inside the .app and the
        # result no longer launches.
        run: ditto -c -k --sequesterRsrc --keepParent dist/CodeErratum.app "dist/${{ matrix.archive }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CodeErratum -DestinationPath "dist/${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
          draft: true
          generate_release_notes: true
