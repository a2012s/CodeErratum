name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --extra dev

      # Scope is ".", not "src tests": scripts/ drifting out of format for four
      # rounds unnoticed is exactly what a narrow scope buys you.
      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        # The failure summary is echoed as GitHub error annotations on purpose:
        # a red job whose log you cannot open tells you nothing. The annotations
        # show up on the commit page and in `gh run view`, so the names of the
        # failing tests are readable without opening the raw log.
        #
        # COLUMNS is pinned for the same reason the test suite pins it: typer
        # draws --help through rich, and rich folds whatever does not fit the
        # line. A runner whose console width is not a number we control would
        # otherwise decide which assertions pass.
        env:
          COLUMNS: "120"
        run: |
          set +e
          uv run pytest -q > /tmp/pytest.log 2>&1
          code=$?
          cat /tmp/pytest.log
          echo "::notice::COLUMNS=$COLUMNS TERM=${TERM:-unset}"
          uv run codeerratum ui --help > /tmp/help.txt 2>&1
          echo "::notice::options=$(grep -oE '\-\-[a-z][a-z-]*' /tmp/help.txt | sort -u | tr '\n' ' ')"
          echo "::notice::versions=$(uv run python -c 'import codeerratum,rich,typer,click; print(codeerratum.__version__, codeerratum.__file__, typer.__version__, click.__version__, rich.__version__)')"
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $code
