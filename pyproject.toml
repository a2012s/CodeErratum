[project]
name = "codeerratum"
dynamic = ["version"]
description = "给 AI 写的代码开一张勘误表 —— 输出给下游 AI 直接执行的 review.md"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CodeErratum contributors" }]
keywords = ["code-review", "agent", "llm", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "httpx>=0.27",
  "rich>=13.7",
  "jedi>=0.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]
desktop = [
  "pywebview>=6.2",
]
pack = [
  "pyinstaller>=6.0",
]

[project.scripts]
codeerratum = "codeerratum.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/codeerratum/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codeerratum"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "packaging",
  "README.md",
  "README.zh-CN.md",
  "开发计划.md",
  "LICENSE",
  "docs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# No fixed --basetemp: pinning it under the repo put pytest's per-test "current"
# symlinks inside a Finder-visible directory, and the next session's rm_rf died
# with ENOTEMPTY, failing collection before a single test ran.

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff 0.17 also formats Python blocks inside Markdown. Our .md files are review
# work orders and change logs, whose snippets are lifted from diffs: a single
# lifted line is not a statement ruff can reformat without changing what it
# means (it would turn `x = f(a)` into `x = (f(a),)`). Formatters must not rewrite
# the record of a past review, so Markdown stays out of the format scope.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
